name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sem chaves de acesso de longa duração: o Actions assume um papel IAM via OIDC
# federado (§9.2). `id-token: write` é o que habilita isso.
permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verificar:
    name: Lint, tipos, testes e synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Sem `version:` aqui de propósito: a action recusa quando a versão
        # aparece em dois lugares. A fonte única é o campo `packageManager`
        # do package.json — que é a versão com que o projeto foi testado.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Inclui a fronteira da arquitetura hexagonal: se packages/core importar
        # AWS, o build quebra aqui (§5.1).
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build do painel
        # Compila a SPA. O `tsc --noEmit` do painel roda aqui e não no typecheck
        # geral porque o build também valida o bundle do Vite.
        run: pnpm --filter @emailmkt/admin-web build

      - name: Synth + cdk-nag
        # Conta fictícia: synth não toca a AWS. As regras de segurança do
        # cdk-nag rodam aqui e falham o build (§9.2).
        env:
          AWS_ACCOUNT_DEV: '000000000000'
          EMAIL_ALARMES: 'ci@exemplo.invalido'
        run: pnpm synth

  # ── Deploy ─────────────────────────────────────────────────────────────────
  # Só a partir de um push na `main`. O gatilho `pull_request` lá em cima existe
  # para o job `verificar`; enquanto os jobs de deploy não filtravam o evento,
  # abrir um PR bastava para implantar — foi o que o PR #1 fez em 2026-08-10,
  # dez minutos depois de aberto, sem revisão e sem merge.
  #
  # Este filtro é só metade da trava. A outra metade é a aprovação obrigatória
  # no GitHub Environment `producao`, que não se declara aqui e por isso não
  # aparece em revisão de diff nenhuma: é preciso olhar as configurações do
  # repositório para saber se ainda existe.

  deploy-dev:
    name: Deploy — dev
    needs: verificar
    # Ligado por variável do repositório, não por edição de código:
    # DEPLOY_HABILITADO em Settings → Variables.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Sem `version:` aqui de propósito: a action recusa quando a versão
        # aparece em dois lugares. A fonte única é o campo `packageManager`
        # do package.json — que é a versão com que o projeto foi testado.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build do painel
        # Antes do deploy, e não depois: a stack Web publica `dist/` como asset,
        # então o diretório precisa existir no momento do synth. A configuração
        # não entra aqui — o painel lê `config.json` em tempo de execução.
        run: pnpm --filter @emailmkt/admin-web build

      - name: Assumir papel na conta dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: sa-east-1

      - name: Deploy
        env:
          AWS_ACCOUNT_DEV: ${{ secrets.AWS_ACCOUNT_DEV }}
          EMAIL_ALARMES: ${{ secrets.EMAIL_ALARMES }}
        # Stacks explícitas, não `--all`.
        #
        # `--all` incluiria a EmailMktGithubOidc*, que é justamente o que dá
        # acesso ao pipeline. Deixar o pipeline implantar a própria credencial é
        # circular: uma implantação malsucedida poderia derrubar o acesso e
        # exigir intervenção manual para voltar. Ela é implantada uma vez, à
        # mão, conforme docs/DEPLOY.md.
        run: |
          pnpm --filter @emailmkt/infra exec cdk deploy \
            EmailMktCoreDev EmailMktSendingDev EmailMktWebDev \
            --require-approval never -c ambiente=dev \
            -c certificadoArn="${{ vars.CERTIFICADO_ARN_DEV }}" \
            -c certificadoRastreamentoArn="${{ vars.CERTIFICADO_RASTREAMENTO_ARN_DEV }}"

      - name: Smoke test
        # Envia para uma caixa de teste verificada. Em dev o SES fica em sandbox
        # de propósito: é impossível atingir um contato real por engano (§9.1).
        run: echo 'TODO — implementar quando o admin-api existir'

  deploy-prod:
    name: Deploy — produção
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    # Aprovação manual no GitHub Environment, com a implantação restrita à
    # `main`. Inegociável: um deploy ruim não é revertível depois que a mensagem
    # saiu (§9.2). O environment existia desde o começo, mas ficou até
    # 2026-08-10 sem nenhuma regra dentro — criado e vazio, que é a forma mais
    # convincente de um controle não existir.
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Sem `version:` aqui de propósito: a action recusa quando a versão
        # aparece em dois lugares. A fonte única é o campo `packageManager`
        # do package.json — que é a versão com que o projeto foi testado.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build do painel
        # Antes do deploy, e não depois: a stack Web publica `dist/` como asset,
        # então o diretório precisa existir no momento do synth. A configuração
        # não entra aqui — o painel lê `config.json` em tempo de execução.
        run: pnpm --filter @emailmkt/admin-web build

      - name: Assumir papel na conta de produção
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: sa-east-1

      - name: Deploy
        env:
          AWS_ACCOUNT_PROD: ${{ secrets.AWS_ACCOUNT_PROD }}
          EMAIL_ALARMES: ${{ secrets.EMAIL_ALARMES }}
        # Stacks explícitas — ver o comentário no deploy de dev.
        run: |
          pnpm --filter @emailmkt/infra exec cdk deploy \
            EmailMktCoreProd EmailMktSendingProd EmailMktWebProd \
            --require-approval never -c ambiente=prod \
            -c certificadoArn="${{ vars.CERTIFICADO_ARN_PROD }}" \
            -c certificadoRastreamentoArn="${{ vars.CERTIFICADO_RASTREAMENTO_ARN_PROD }}"
